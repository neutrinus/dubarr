name: E2E (CPU, real models)

# Dubs a short public-domain clip with the real pipeline on a CPU runner, using small models
# (Whisper small, Qwen2.5 3B, OmniVoice on CPU). Checks plumbing, not translation quality.
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL or path (default: NASA ISS interview, public domain)"
        required: false
      start:
        description: "Clip start (seconds)"
        default: "60"
      duration:
        description: "Clip length (seconds)"
        default: "60"
      langs:
        description: "Target languages"
        default: "pl"
  schedule:
    - cron: "0 3 * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/e2e-cpu.yml"
      - "scripts/e2e_test.py"
      - "src/**"
      - "Dockerfile"
      - "pyproject.toml"

concurrency:
  group: e2e-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Dub a real clip on CPU
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      UV_HTTP_TIMEOUT: "600"
      DATA_DIR: ${{ github.workspace }}/e2e_out/data
      HF_HOME: ${{ github.workspace }}/.model-cache/hf
      TORCH_HOME: ${{ github.workspace }}/.model-cache/torch
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      WHISPER_MODEL: small
      LLM_MODEL_REPO: Qwen/Qwen2.5-3B-Instruct-GGUF
      LLM_MODEL_FILE: qwen2.5-3b-instruct-q4_k_m.gguf
      TTS_TIMEOUT: "600"
      TARGET_LANGS: ${{ inputs.langs || 'pl' }}
      E2E_VIDEO_URL: ${{ inputs.video_url }}
      E2E_START: ${{ inputs.start || '60' }}
      E2E_DURATION: ${{ inputs.duration || '60' }}
    steps:
      - uses: actions/checkout@v7

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.5"

      # Same single venv as the Dockerfile (Python 3.12, OmniVoice included), with CPU wheels.
      - name: Create venv (Python 3.12)
        run: |
          uv python install 3.12
          uv venv .venv --python 3.12
          # Torch from the CPU index first, everything else from PyPI only: the CPU index also serves
          # stale builds of unrelated packages.
          uv pip install --python .venv/bin/python3 --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.8.0" "torchvision" "torchaudio==2.8.0"
          TV_PIN=$(.venv/bin/python3 -c "import torchvision; print(torchvision.__version__.split('+')[0])")
          uv pip install --python .venv/bin/python3 \
            "numpy==2.2.2" "torch==2.8.0" "torchvision==$TV_PIN" "torchaudio==2.8.0" \
            "pyannote.audio==4.0.7" "faster-whisper" "av>=15,<19" "demucs>=4.1.0" "diffq" \
            "omnivoice==0.2.1" "flask" \
            "huggingface_hub" "pydub" "soundfile" "humanfriendly" "psutil" "scipy" "requests" "syllables" \
            "fastapi" "uvicorn[standard]" "websockets" "jinja2" "python-multipart"
          uv pip install --python .venv/bin/python3 llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Restore model cache
        uses: actions/cache@v6
        with:
          path: |
            .model-cache
            e2e_out/data/models
          key: e2e-models-v2-omnivoice-${{ env.WHISPER_MODEL }}-${{ env.LLM_MODEL_FILE }}

      - name: Note missing HF_TOKEN
        if: env.HF_TOKEN == ''
        run: echo "::warning::HF_TOKEN secret is not set, diarization is replaced by a single speaker."

      - name: Run E2E
        run: |
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          python3 -c "import torch, av, faster_whisper, transformers; print('torch', torch.__version__, 'av', av.__version__, 'faster-whisper', faster_whisper.__version__, 'transformers', transformers.__version__)"
          python3 scripts/e2e_test.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-result
          path: |
            e2e_out/clip.mkv
            e2e_out/data/logs/processing.log
          if-no-files-found: ignore
          retention-days: 14
