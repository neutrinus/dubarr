name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]

# A newer push to the same PR cancels the run still going; main and tags always finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.13.5"
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          uv sync --group dev --python 3.10
      - name: Lint with ruff
        run: |
          uv run ruff check .
      - name: Lint with flake8
        run: |
          uv run flake8 .
      - name: Lint with pylint
        run: |
          uv run pylint $(git ls-files 'src/*.py') --exit-zero
      - name: Run unit tests
        env:
          MOCK_MODE: "1"
        run: |
          export PYTHONPATH=$PYTHONPATH:.:src
          uv run pytest tests/ --cov=src --cov-report=term --cov-fail-under=60

  # One image build per run: smoke-tested in MOCK_MODE, then pushed (main and tags only). The layer cache lives in the
  # registry (no 10 GB limit like the Actions cache), so a build only reinstalls the venv when the Dockerfile changes.
  docker:
    name: Docker build, smoke test and publish
    needs: [qa]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REF: ghcr.io/${{ github.repository }}:buildcache
    steps:
      # The CUDA image does not fit on a stock runner disk. Deleting the biggest preinstalled toolchains in parallel
      # takes seconds; the apt purge of jlumbroso/free-disk-space took 2.5-6.5 minutes.
      - name: Free disk space
        run: |
          df -h /
          for d in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache \
                   /usr/local/share/boost /usr/share/swift /usr/local/share/powershell /usr/local/share/chromium \
                   /usr/lib/jvm /opt/microsoft /opt/google /opt/az /usr/local/julia* /usr/share/miniconda; do
            sudo rm -rf $d &
          done
          sudo swapoff -a && sudo rm -f /mnt/swapfile /swapfile &
          docker system prune -af >/dev/null &
          wait
          df -h /

      - uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      # Every run writes the cache (a fork PR cannot, ignore-error keeps that from failing the build), so main reuses
      # the layers a PR that changed the Dockerfile already built.
      # The default docker driver builds straight into the runner's (containerd) image store: no second copy of the
      # image in a buildx container, and the smoke test runs the exact image that gets pushed.
      - name: Build image
        run: |
          docker buildx build . -t dubarr:test \
            --cache-from type=registry,ref=$CACHE_REF \
            --cache-to type=registry,ref=$CACHE_REF,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          df -h /

      - name: Start container in MOCK mode
        run: |
          docker run -d --name dubarr-test \
            -e MOCK_MODE=1 \
            -e HF_TOKEN=dummy \
            -e PUID=$(id -u) \
            -e PGID=$(id -g) \
            -v /tmp:/tmp \
            -p 8000:8000 \
            dubarr:test

      - name: Install smoke test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg python3-requests

      # The script waits for /health itself
      - name: Run smoke test
        run: /usr/bin/python3 scripts/smoke_test.py

      - name: Container logs
        if: always()
        run: docker logs dubarr-test || true

      - name: Cleanup
        if: always()
        run: docker rm -f dubarr-test || true

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker tag dubarr:test "$tag"
            docker push "$tag"
          done
